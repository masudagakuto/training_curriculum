# MySQL. Versions 5.5.8 and up are supported.
#
# Ruby 3.1+ / Psych 4.x ではYAMLエイリアス（<<: *default）が
# デフォルトで無効になるため、各環境に明示的に記述しています。

development:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password:
  socket: /tmp/mysql.sock
  database: training_development

test:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password:
  socket: /tmp/mysql.sock
  database: training_test

production:
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: training
  password: <%= ENV['TRAINING_DATABASE_PASSWORD'] %>
  socket: /tmp/mysql.sock
  database: training_production
